# STM32G030F6P6TR: Cortex-M0+, 32 KiB Flash, 8 KiB RAM.
# Probe: ST-LINK/V2, ST-LINK/V2-1 or STLINK-V3, connected through SWD.
#
# Note: in OpenOCD 0.12 interface/stlink.cfg selects the HLA driver, so the
# transport is "hla_swd" instead of "swd", and cortex_m reset_config does not
# apply (the target script skips it for HLA). Both are SWD on the wire.
# For OpenOCD 0.11 use: source [find interface/stlink-v2-1.cfg]
source [find interface/stlink.cfg]
transport select hla_swd

set CHIPNAME stm32g030f6
set WORKAREASIZE 0x1000
source [find target/stm32g0x.cfg]

# Initial SWD clock, in kHz.
adapter speed 1000

# Software reset; NRST connection is optional.
# If "reset" fails, wire NRST and replace this line with: reset_config srst_only
reset_config none

# Keep the conservative SWD clock when reset starts.
$_TARGETNAME configure -event reset-start { adapter speed 1000 }

# Usage (run from the project root):
# openocd -f stm32g030_stlink.cfg -c "program build/Debug/Power_Test.elf verify reset exit"
