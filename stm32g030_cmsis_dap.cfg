# STM32G030F6P6TR: Cortex-M0+, 32 KiB Flash, 8 KiB RAM.
# Probe: CMSIS-DAP, connected through SWD.
source [find interface/cmsis-dap.cfg]
transport select swd

set CHIPNAME stm32g030f6
set WORKAREASIZE 0x1000
source [find target/stm32g0x.cfg]

# Initial SWD clock, in kHz.
adapter speed 1000

# Software reset; NRST connection is optional.
reset_config none
cortex_m reset_config sysresetreq

# Keep the conservative SWD clock when reset starts.
$_TARGETNAME configure -event reset-start { adapter speed 1000 }

# Usage (run from the project root):
# openocd -f stm32g030_cmsis_dap.cfg -c "program build/Debug/Power_Test.elf verify reset exit"
